<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
<title id="title">Sanad deterministic night-shift replay workflow</title>
<desc id="desc">Fixed synthetic records pass through loading, unit and timeline checks, four independent rule modules, board generation, and an offline role-based HTML board. A Bed 6 example distinguishes event time from documentation time.</desc>
<defs><marker id="arrow" markerWidth="18" markerHeight="18" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#c7622d"/></marker></defs>
<rect width="1080" height="1350" fill="#f7f5f2"/>
<rect x="50" y="28" width="960" height="48" rx="14" fill="#f7e7dc" stroke="#f7e7dc" stroke-width="0"/><text x="535" y="62" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="28" font-weight="700" fill="#c7622d" text-anchor="middle">FICTIONAL DATA · SIMULATION · NOT FOR CLINICAL USE</text><text x="50" y="130" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="43" font-weight="750" fill="#1b1d21" text-anchor="start">Sanad · deterministic night replay</text><text x="50" y="169" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="28" font-weight="400" fill="#565c64" text-anchor="start">Synthetic records → rule cells → offline board</text><rect x="50" y="205" width="980" height="198" rx="22" fill="#ffffff" stroke="#d9d5ce" stroke-width="2"/><rect x="50" y="443" width="980" height="198" rx="22" fill="#ffffff" stroke="#d9d5ce" stroke-width="2"/><rect x="50" y="681" width="980" height="198" rx="22" fill="#ffffff" stroke="#d9d5ce" stroke-width="2"/><rect x="50" y="919" width="980" height="198" rx="22" fill="#ffffff" stroke="#d9d5ce" stroke-width="2"/><path d="M540,409 L540,433" fill="none" stroke="#c7622d" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M540,647 L540,671" fill="none" stroke="#c7622d" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M540,885 L540,909" fill="none" stroke="#c7622d" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><text x="78" y="249" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="30" font-weight="750" fill="#1b1d21" text-anchor="start">1 · Fixed input</text><text x="1010" y="249" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="28" font-weight="650" fill="#c7622d" text-anchor="end">data/ward_seed42</text><text x="78" y="294" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="28" font-weight="400" fill="#1b1d21" text-anchor="start">17 beds · 18 fictional encounters · seed 42</text><text x="78" y="339" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="28" font-weight="400" fill="#1b1d21" text-anchor="start">No upload · no external feed · synthetic only</text><text x="78" y="487" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="30" font-weight="750" fill="#1b1d21" text-anchor="start">2 · Load + normalise</text><text x="1010" y="487" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="28" font-weight="650" fill="#c7622d" text-anchor="end">loader.py</text><text x="78" y="532" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="28" font-weight="400" fill="#1b1d21" text-anchor="start">loader.py · units.py</text><text x="78" y="577" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="28" font-weight="400" fill="#1b1d21" text-anchor="start">Validate fixed records · normalise units · no temporal evaluation</text><text x="78" y="725" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="30" font-weight="750" fill="#1b1d21" text-anchor="start">3 · Time-filter + evaluate</text><text x="1010" y="725" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="28" font-weight="650" fill="#c7622d" text-anchor="end">evaluate.py</text><text x="78" y="770" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="28" font-weight="400" fill="#1b1d21" text-anchor="start">timeline.py · freshness.py · five-minute grid</text><text x="78" y="809" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="28" font-weight="400" fill="#1b1d21" text-anchor="start">R1 · R2a · R2b · R3 independent modules</text><text x="78" y="848" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="28" font-weight="400" fill="#1b1d21" text-anchor="start">Combined R2 only when both parts are met</text><text x="78" y="963" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="30" font-weight="750" fill="#1b1d21" text-anchor="start">4 · Generate + replay</text><text x="1010" y="963" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="28" font-weight="650" fill="#c7622d" text-anchor="end">board.py</text><text x="78" y="1008" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="28" font-weight="400" fill="#1b1d21" text-anchor="start">build_board_model → render_html → dist/board.html</text><text x="78" y="1047" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="28" font-weight="400" fill="#1b1d21" text-anchor="start">Night nurse / on-call doctor · no JavaScript rule engine</text><text x="78" y="1086" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="28" font-weight="400" fill="#1b1d21" text-anchor="start">Simulated actions remain in memory and reset on reload</text><rect x="50" y="1153" width="980" height="142" rx="22" fill="#f7e7dc" stroke="#e7c9b5" stroke-width="2"/><text x="78" y="1197" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="28" font-weight="750" fill="#c7622d" text-anchor="start">Bed 6 · late-documented 1.0 L at 02:00</text><text x="78" y="1237" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="28" font-weight="600" fill="#1b1d21" text-anchor="start">01:55: +1.6 L / R2b not_met</text><text x="78" y="1273" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="28" font-weight="600" fill="#1b1d21" text-anchor="start">02:00: +2.6 L / R2a + R2b met → combined review</text><text x="540" y="1325" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="28" font-weight="500" fill="#565c64" text-anchor="middle">Offline · no account · no patient-data entry · no real recipients</text></svg>