<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Sanad deterministic night-shift replay workflow</title>
<desc id="desc">Fixed synthetic records pass through loading, unit and timeline checks, four independent rule modules, board generation, and an offline role-based HTML board. A Bed 6 example distinguishes event time from documentation time.</desc>
<defs><marker id="arrow" markerWidth="18" markerHeight="18" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#c7622d"/></marker></defs>
<rect width="1600" height="900" fill="#f7f5f2"/>
<rect x="60" y="28" width="780" height="48" rx="14" fill="#f7e7dc" stroke="#f7e7dc" stroke-width="0"/><text x="84" y="62" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="28" font-weight="700" fill="#c7622d" text-anchor="start">FICTIONAL DATA · SIMULATION · NOT FOR CLINICAL USE</text><text x="60" y="132" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="44" font-weight="750" fill="#1b1d21" text-anchor="start">Sanad · deterministic night-shift replay</text><text x="60" y="169" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="28" font-weight="400" fill="#565c64" text-anchor="start">Fixed synthetic records → five-minute evaluation → offline role-based board</text><rect x="60" y="215" width="250" height="430" rx="22" fill="#ffffff" stroke="#d9d5ce" stroke-width="2"/><rect x="355" y="215" width="280" height="430" rx="22" fill="#ffffff" stroke="#d9d5ce" stroke-width="2"/><rect x="680" y="215" width="405" height="430" rx="22" fill="#ffffff" stroke="#d9d5ce" stroke-width="2"/><rect x="1130" y="215" width="410" height="430" rx="22" fill="#ffffff" stroke="#d9d5ce" stroke-width="2"/><path d="M317,405 L348,405" fill="none" stroke="#c7622d" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M642,405 L673,405" fill="none" stroke="#c7622d" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M1092,405 L1123,405" fill="none" stroke="#c7622d" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><text x="84" y="262" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="30" font-weight="750" fill="#1b1d21" text-anchor="start">1 · Fixed input</text><rect x="84" y="290" width="202" height="58" rx="12" fill="#efede9" stroke="#d9d5ce" stroke-width="1"/><text x="185" y="328" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="26" font-weight="650" fill="#c7622d" text-anchor="middle">ward_seed42</text><text x="84" y="391" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="28" font-weight="400" fill="#1b1d21" text-anchor="start">17 beds</text><text x="84" y="440" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="28" font-weight="400" fill="#1b1d21" text-anchor="start">18 encounters</text><text x="84" y="489" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="28" font-weight="400" fill="#1b1d21" text-anchor="start">Seed 42</text><text x="84" y="538" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="28" font-weight="400" fill="#1b1d21" text-anchor="start">No data entry</text><text x="379" y="262" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="29" font-weight="750" fill="#1b1d21" text-anchor="start">2 · Load</text><rect x="379" y="290" width="232" height="57" rx="12" fill="#efede9" stroke="#d9d5ce" stroke-width="1"/><text x="495" y="328" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="26" font-weight="650" fill="#c7622d" text-anchor="middle">loader.py</text><text x="379" y="402" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="27" font-weight="400" fill="#1b1d21" text-anchor="start">Validate records</text><text x="379" y="457" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="27" font-weight="400" fill="#1b1d21" text-anchor="start">Normalise units</text><text x="379" y="512" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="27" font-weight="400" fill="#1b1d21" text-anchor="start">No time filter</text><text x="379" y="562" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="25" font-weight="400" fill="#565c64" text-anchor="start">Fixed records only</text><text x="379" y="598" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="25" font-weight="400" fill="#565c64" text-anchor="start">Synthetic only</text><text x="704" y="262" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="30" font-weight="750" fill="#1b1d21" text-anchor="start">3 · Evaluate the ward</text><rect x="704" y="290" width="357" height="57" rx="12" fill="#efede9" stroke="#d9d5ce" stroke-width="1"/><text x="882" y="328" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="26" font-weight="650" fill="#c7622d" text-anchor="middle">evaluate.py</text><rect x="704" y="360" width="171" height="72" rx="12" fill="#f7e7dc" stroke="#f7e7dc" stroke-width="0"/><text x="718" y="389" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="28" font-weight="750" fill="#c7622d" text-anchor="start">R1</text><text x="718" y="419" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="24" font-weight="500" fill="#1b1d21" text-anchor="start">SBT review</text><rect x="890" y="360" width="171" height="72" rx="12" fill="#f7e7dc" stroke="#f7e7dc" stroke-width="0"/><text x="904" y="389" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="28" font-weight="750" fill="#c7622d" text-anchor="start">R2a</text><text x="904" y="419" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="24" font-weight="500" fill="#1b1d21" text-anchor="start">O2 trend</text><rect x="704" y="448" width="171" height="72" rx="12" fill="#f7e7dc" stroke="#f7e7dc" stroke-width="0"/><text x="718" y="477" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="28" font-weight="750" fill="#c7622d" text-anchor="start">R2b</text><text x="718" y="507" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="24" font-weight="500" fill="#1b1d21" text-anchor="start">Fluid ledger</text><rect x="890" y="448" width="171" height="72" rx="12" fill="#f7e7dc" stroke="#f7e7dc" stroke-width="0"/><text x="904" y="477" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="28" font-weight="750" fill="#c7622d" text-anchor="start">R3</text><text x="904" y="507" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="24" font-weight="500" fill="#1b1d21" text-anchor="start">Task tracker</text><text x="882" y="557" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="24" font-weight="600" fill="#565c64" text-anchor="middle">timeline.py + freshness.py</text><text x="882" y="606" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="24" font-weight="600" fill="#565c64" text-anchor="middle">Both R2 parts met → combined R2</text><text x="1154" y="262" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="30" font-weight="750" fill="#1b1d21" text-anchor="start">4 · Generate + replay</text><rect x="1154" y="290" width="362" height="57" rx="12" fill="#efede9" stroke="#d9d5ce" stroke-width="1"/><text x="1335" y="328" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="26" font-weight="650" fill="#c7622d" text-anchor="middle">board.py</text><text x="1154" y="383" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="24" font-weight="500" fill="#565c64" text-anchor="start">build_board_model → render_html</text><text x="1154" y="428" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="30" font-weight="750" fill="#c7622d" text-anchor="start">dist/board.html</text><text x="1154" y="466" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="26" font-weight="400" fill="#1b1d21" text-anchor="start">Nurse / doctor views</text><text x="1154" y="494" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="26" font-weight="400" fill="#1b1d21" text-anchor="start">Precomputed cells</text><text x="1154" y="522" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="26" font-weight="400" fill="#1b1d21" text-anchor="start">No JS rule engine</text><text x="1154" y="550" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="26" font-weight="400" fill="#1b1d21" text-anchor="start">Simulated actions</text><text x="1154" y="578" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="26" font-weight="400" fill="#1b1d21" text-anchor="start">Reset on reload</text><rect x="60" y="655" width="1480" height="157" rx="22" fill="#f7e7dc" stroke="#e7c9b5" stroke-width="2"/><text x="84" y="696" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="28" font-weight="750" fill="#c7622d" text-anchor="start">One traced fixture · Bed 6 · event time ≠ documentation time</text><text x="84" y="740" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="28" font-weight="700" fill="#1b1d21" text-anchor="start">20:00 · 1.0 L event</text><text x="84" y="776" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="24" font-weight="400" fill="#565c64" text-anchor="start">Not yet known to the board</text><path d="M465,741 L570,741" fill="none" stroke="#c7622d" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><text x="600" y="740" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="28" font-weight="700" fill="#1b1d21" text-anchor="start">01:55 · +1.6 L known</text><text x="600" y="776" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="24" font-weight="500" fill="#565c64" text-anchor="start">R2b not_met</text><path d="M969,741 L1074,741" fill="none" stroke="#c7622d" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><text x="1104" y="740" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="28" font-weight="700" fill="#1b1d21" text-anchor="start">02:00 · +2.6 L known</text><text x="1104" y="776" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="24" font-weight="500" fill="#565c64" text-anchor="start">R2a + R2b met → combined review</text><text x="800" y="857" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="26" font-weight="500" fill="#565c64" text-anchor="middle">Offline HTML · no account · no patient-data entry · no real recipients</text></svg>